[package]
name = "copybook"
version = "1.2.0"
description = "Clipboard history for Windows"
edition = "2021"
license = "MIT"

[lib]
name = "copybook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
regex = "1"
url = "2"
log = "0.4"
html-escape = "0.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Globalization", "Win32_Networking_WinHttp"] }

[dev-dependencies]
tempfile = "3"
base64 = "0.22"

[features]
custom-protocol = ["tauri/custom-protocol"]
